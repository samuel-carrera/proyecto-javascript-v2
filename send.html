<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Enviar Dinero</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Barra de navegación -->
<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand fw-bold">Alke Wallet</span>
    <a href="menu.html" class="btn btn-outline-light btn-sm">Volver al Menú</a>
</nav>

<!-- Contenido Principal -->
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4 text-primary fw-bold">Enviar Dinero</h3>

        <form id="sendForm">
            <div class="mb-3">
                <label for="contacto" class="form-label">Contacto / Destinatario</label>
                <input type="text" class="form-control" id="contacto" placeholder="Nombre o Cuenta" required>
            </div>
            <div class="mb-3">
                <label for="montoEnvio" class="form-label">Monto a enviar ($)</label>
                <input type="number" class="form-control" id="montoEnvio" placeholder="Ej: 15000" min="1" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Confirmar Envío</button>
        </form>
    </div>
</div>

<!-- Archivo de JavaScript -->
<script src="src/app.js"></script>
</body>
</html>
